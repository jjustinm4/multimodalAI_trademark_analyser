version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: trademark
      POSTGRES_USER: trademark
      POSTGRES_PASSWORD: trademark_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademark"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trademark:trademark_dev@postgres:5432/trademark
      LLM_BASE_URL: http://host.docker.internal:8080/v1
      LLM_MODEL: gpt-oss-20b
      FUSION_W_PHONETIC: 0.30
      FUSION_W_SEMANTIC: 0.30
      FUSION_W_VISUAL: 0.20
      FUSION_W_GOODS: 0.20
      EMBEDDING_DEVICE: cuda
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - model_cache:/root/.cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  model_cache:
